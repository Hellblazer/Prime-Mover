# Hang tripwire (bead Prime-Mover-d1m): the framework module's whole domain is
# parking/resuming threads via EventImpl.park() / Continuation.park(). A single
# test that parks its thread without a resumer hangs forever with no signal
# distinguishing "fixed" from "not run". This default timeout converts any such
# hang into a fast, loud JUnit TimeoutException instead of an unbounded, billed
# CI run. Raise per-test with @Timeout only if a legitimately slower test needs it.
junit.jupiter.execution.timeout.default = 60 s
